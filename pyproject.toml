[project]
name = "raman-deep-learning"
version = "0.1.0"
description = "Analysis framework for Raman surface mapping data: spatial visualisation, distinct-spectra estimation, NMF unmixing and CNN compound prediction."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Raj Negi" }]
dependencies = [
    # Imported directly by src/, scripts/ or tests/:
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "ramanspy>=0.2.10,<0.3",
    "kneed>=0.8,<0.9",
    "pysptools>=0.15,<0.16",
    "keras>=3.10,<4",
    # Required without being imported: Keras draws its layers through whichever backend
    # is installed, and train.py calls keras.utils.plot_model, which needs pydot.
    "tensorflow>=2.20,<2.21",
    "pydot>=4.0,<5",
]

[project.optional-dependencies]
# httpx is what fastapi.testclient drives the app with, so it sits with the suite.
dev = ["pytest>=8", "httpx>=0.27,<1"]
# The serving layer in app/. Deliberately not in the list above: a trained run records
# the names that list holds, and a web server is not something a model was trained
# against. Install it as '.[dev,web]' to run the browser interface and its tests.
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# What running a notebook needs that the framework does not. notebooks/test_nn.py is the
# only file in the tree that imports torch, and keeping it out of the list above keeps the
# CUDA wheels torch pulls in out of an ordinary install. The three jupyter packages are
# what executes a notebook to a file with its outputs in it; a front end for editing one
# interactively is left to whoever is reading it.
notebooks = ["torch>=2.10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The installed packages are the framework, its entry points, and the serving layer
# that puts them in a browser. tests/ and notebooks/ are run from the checkout and are
# not part of the distribution.
include = ["src*", "scripts*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
